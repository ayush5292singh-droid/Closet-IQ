<script>
"use strict";
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CATS=["Tops","Bottoms","Dresses","Outerwear","Shoes","Accessories","Bags","Other"];
const COLORS=[["Black","#151515"],["White","#eeeeee"],["Silver","#aaa"],["Grey","#777"],["Red","#ad3030"],["Blue","#365eaa"],["Green","#42745b"],["Beige","#c4ad8b"],["Pink","#d38aa6"],["Brown","#79563e"],["Purple","#8063ad"],["Yellow","#d2b650"]];
const DEFAULT=()=>({version:1,profile:{name:"",style:"Minimalist",occasion:"Everyday",sizes:"",bio:""},items:[],outfits:[],designs:[],plans:{},collections:[],settings:{currency:"INR",unit:"cm"},favorites:[]});
let state=loadState(),currentPage="dashboard",editingItem=null,editingOutfit=null,selectedColor="#d1d1d1",designShape="tee",studioModel="illustration",studioPhoto=null,canvasImages=[],currentMonth=new Date(),selectedPlanDate="",activeFilters={cat:"All",search:""},lastCanvas=null;

function loadState(){
 try{const raw=localStorage.getItem("closetiq_ultimate_v1");if(raw){const s=JSON.parse(raw);return Object.assign(DEFAULT(),s,{profile:{...DEFAULT().profile,...s.profile},settings:{...DEFAULT().settings,...s.settings},plans:s.plans||{},items:s.items||[],outfits:s.outfits||[],designs:s.designs||[],collections:s.collections||[],favorites:s.favorites||[]})}}catch(e){}
 return DEFAULT();
}
function saveState(silent=false){
 try{localStorage.setItem("closetiq_ultimate_v1",JSON.stringify(state));if(!silent)toast("Changes saved on this device.")}catch(e){toast("Browser storage is full. Export a backup and remove some large photos.",5000)}
 updateHeader();
}
function toast(msg,ms=2700){const d=document.createElement("div");d.className="toast";d.textContent=msg;$("#toasts").appendChild(d);setTimeout(()=>d.remove(),ms)}
function navigate(p){currentPage=p;$("#sidebar").classList.remove("open");document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===p));const titles={dashboard:"Overview",wardrobe:"My Wardrobe",studio:"Outfit Studio",calendar:"Style Calendar",design:"Fashion Design Lab",lookbooks:"Lookbooks & Collections",analytics:"Style Analytics",profile:"My Style Profile",settings:"Settings & Backup"};$("#topTitle").textContent=titles[p]||p;renderPage();window.scrollTo({top:0,behavior:"smooth"})}
function toggleMenu(){$("#sidebar").classList.toggle("open")}
function updateHeader(){const n=state.profile.name.trim();$("#avatar").textContent=n?n[0].toUpperCase():"C"}
document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>navigate(b.dataset.page)));
function pageHead(kicker,title,desc,button=""){return `<div class="page-head"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${desc}</p></div>${button}</div>`}
function empty(icon,title,desc,button){return `<div class="empty"><div class="big">${icon}</div><b>${title}</b><p>${desc}</p>${button||""}</div>`}
function renderPage(){const fn={dashboard:renderDashboard,wardrobe:renderWardrobe,studio:renderStudio,calendar:renderCalendar,design:renderDesign,lookbooks:renderLookbooks,analytics:renderAnalytics,profile:renderProfile,settings:renderSettings}[currentPage];$("#page").innerHTML=fn();if(currentPage==="studio")initStudio();if(currentPage==="design")drawDesignPreview();if(currentPage==="calendar"){}}
function getItem(id){return state.items.find(x=>x.id===id)}
function getOutfit(id){return state.outfits.find(x=>x.id===id)}
function itemImg(item){return item?.image||""}
function imgOrPlaceholder(item){return item?.image?`<img src="${item.image}" alt="${esc(item.name)}" loading="lazy">`:`<div style="height:100%;display:grid;place-items:center;color:#666;font-size:35px">◇</div>`}
function stat(label,value,icon,foot){return `<div class="card"><div class="stat-top"><span>${label}</span><span class="stat-icon">${icon}</span></div><div class="stat-value">${value}</div><div class="stat-foot">${foot}</div></div>`}
function renderDashboard(){
 const tops=state.items.length, outfits=state.outfits.length, cats=new Set(state.items.map(i=>i.category)).size, plans=Object.keys(state.plans).length;
 const recent=state.items.slice().reverse().slice(0,3);
 const quick=[["▤","Organize wardrobe","wardrobe"],["◉","Compose an outfit","studio"],["✳","Design a piece","design"],["▦","Plan your week","calendar"]];
 return `${pageHead("YOUR STYLE, REIMAGINED",`Welcome${state.profile.name?", "+esc(state.profile.name):" to your studio"}.`,"Your wardrobe. Your creativity. Your signature style.",`<button class="btn primary" onclick="openAdd()">＋ Add clothing</button>`)}
 <div class="grid stats">${stat("WARDROBE PIECES",tops,"▤","Your digital collection")}${stat("SAVED OUTFITS",outfits,"◉","Looks you've created")}${stat("CATEGORIES",cats,"◈","Categories in use")}${stat("PLANNED DAYS",plans,"▦","Dates with a planned look")}</div>
 <div class="grid dashboard-grid">
  <div class="grid" style="gap:16px;align-content:start">
   <div class="card hero"><div class="hero-copy"><div class="hero-tag">THE ART OF GETTING DRESSED</div><h2>Less clutter.<br>More character.</h2><p>Create outfits from what you own, discover your signature style, and make every piece work harder.</p><button class="btn primary" onclick="navigate('studio')">Enter Outfit Studio ↗</button></div></div>
   <div class="card"><div class="section-title"><h3>Quick studio access</h3><small>Make something new</small></div><div class="grid quick-grid">${quick.map(([i,n,p])=>`<button class="quick" onclick="navigate('${p}')"><i>${i}</i><b>${n}</b><small>Open studio ↗</small></button>`).join("")}</div></div>
   <div class="card"><div class="section-title"><h3>Recently added</h3><button class="btn small ghost" onclick="navigate('wardrobe')">View wardrobe ↗</button></div>${recent.length?`<div class="mini-items">${recent.map(i=>`<div class="mini-item">${imgOrPlaceholder(i)}<b>${esc(i.name)}</b><span>${esc(i.category)}</span></div>`).join("")}</div>`:empty("▤","Your wardrobe starts here","Upload photos of clothing you already own. Build your first digital collection.",`<button class="btn primary" onclick="openAdd()">＋ Add first item</button>`)}</div>

function previewItemFile(input){
 const f=input.files?.[0];if(!f)return;if(!f.type.startsWith("image/"))return toast("Please choose an image.");

function compressImage(file,max=1100,quality=.78){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),im=new Image();im.onload=()=>{const ratio=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*ratio);c.height=Math.round(im.height*ratio);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);try{resolve(c.toDataURL("image/jpeg",quality))}catch(e){reject(e)}};im.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("Image load failed"))};im.src=url})}

function drawCanvas(){
 const c=$("#tryCanvas");if(!c)return;const ctx=c.getContext("2d"),w=c.width,h=c.height;ctx.clearRect(0,0,w,h);
 const g=ctx.createRadialGradient(w/2,h*.42,20,w/2,h*.42,490);g.addColorStop(0,"#383838");g.addColorStop(1,"#111111");ctx.fillStyle=g;ctx.fillRect(0,0,w,h);

 // Stylized original mannequin silhouette, not a real person.
 ctx.save();ctx.fillStyle="#c4c4c4";ctx.strokeStyle="#e8e8e8";ctx.lineWidth=2;
 ctx.beginPath();ctx.ellipse(360,115,48,58,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#a8a8a8";ctx.beginPath();ctx.moveTo(326,166);ctx.lineTo(394,166);ctx.lineTo(410,207);ctx.lineTo(455,248);ctx.lineTo(432,425);ctx.lineTo(411,455);ctx.lineTo(309,455);ctx.lineTo(288,425);ctx.lineTo(265,248);ctx.lineTo(310,207);ctx.closePath();ctx.fill();
 ctx.fillStyle="#b9b9b9";ctx.beginPath();ctx.moveTo(310,207);ctx.lineTo(265,248);ctx.lineTo(218,442);ctx.lineTo(247,451);ctx.lineTo(321,285);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(410,207);ctx.lineTo(455,248);ctx.lineTo(502,442);ctx.lineTo(473,451);ctx.lineTo(399,285);ctx.closePath();ctx.fill();
 ctx.fillStyle="#8e8e8e";ctx.beginPath();ctx.moveTo(309,455);ctx.lineTo(360,455);ctx.lineTo(349,667);ctx.lineTo(331,804);ctx.lineTo(288,804);ctx.lineTo(301,651);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(360,455);ctx.lineTo(411,455);ctx.lineTo(419,651);ctx.lineTo(432,804);ctx.lineTo(389,804);ctx.lineTo(371,667);ctx.closePath();ctx.fill();
 ctx.fillStyle="#d0d0d0";ctx.beginPath();ctx.ellipse(310,810,37,12,-.08,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(410,810,37,12,.08,0,Math.PI*2);ctx.fill();
 ctx.restore();ctx.fillStyle="#ffffff99";ctx.font="12px sans-serif";ctx.textAlign="center";ctx.fillText("C L O S E T I Q   /   V I R T U A L   S T U D I O",w/2,35);

function drawClothes(ctx,w,h){
 // Layer photo crops in composition zones. This is a visual collage, not body-aware fitting.
 const zones={Tops:[245,190,230,245],Bottoms:[285,405,155,250],Dresses:[265,185,195,440],Outerwear:[218,175,285,300],Shoes:[265,695,195,110],Accessories:[340,135,125,95],Bags:[410,340,100,130],Other:[270,300,180,190]};

 imgs.forEach((x,idx)=>{const im=new Image();im.onload=()=>{const z=zones[x.category]||zones.Other;let [xx,yy,ww,hh]=z;if(x.category==="Accessories")xx=410;if(x.category==="Shoes")xx=250;if(idx>0){xx+=idx*7;yy+=idx*9}ctx.save();ctx.globalAlpha=.91;ctx.shadowColor="#000";ctx.shadowBlur=9;ctx.drawImage(im,xx,yy,ww,hh);ctx.restore();ctx.fillStyle="#ffffffcc";ctx.font="11px sans-serif";ctx.textAlign="left";ctx.fillText(x.name.slice(0,24),xx,yy+hh+14)};im.src=x.image});
}

 return `${pageHead("FROM IDEA TO GARMENT","Fashion Design Lab","Experiment with silhouettes, colors, names, and concept boards. These are concept sketches, not production-ready technical patterns.",`<button class="btn primary" onclick="saveDesign()">＋ Save design</button>`)}
 <div class="studio-layout"><div class="card"><div class="section-title"><h3>Live design canvas</h3><small>Original vector concept</small></div><div class="design-preview" id="designPreview"></div><div class="divider"></div><label class="label">Garment silhouette</label><div class="toolbar">${[["tee","T-shirt"],["hoodie","Hoodie"],["pants","Trousers"],["dress","Dress"]].map(([v,l])=>`<button class="btn small ${designShape===v?"primary":""}" onclick="designShape='${v}';renderPage()">${l}</button>`).join("")}</div><label class="label">Color palette</label><div class="swatches">${COLORS.map(([n,c])=>`<button class="swatch ${selectedColor===c?"selected":""}" style="background:${c}" title="${n}" aria-label="${n}" onclick="selectedColor='${c}';renderPage()"></button>`).join("")}</div><div class="tiny" style="margin-top:10px">Selected color: ${COLORS.find(c=>c[1]===selectedColor)?.[0]||"Custom"}</div><div class="divider"></div><button class="btn" style="width:100%" onclick="exportDesign()">⇩ Export concept PNG</button></div>
 <div class="card"><div class="section-title"><h3>Design brief</h3><small>Your creative direction</small></div><div class="form-field"><label class="label">Design name *</label><input class="field" id="designName" maxlength="100" placeholder="e.g. Eclipse Utility Jacket"></div><div class="form-field" style="margin-top:15px"><label class="label">Collection</label><input class="field" id="designCollection" maxlength="70" placeholder="e.g. FUTURE FORMS"></div><div class="form-field" style="margin-top:15px"><label class="label">Fabric idea</label><input class="field" id="designFabric" maxlength="100" placeholder="e.g. Organic cotton twill"></div><div class="form-field" style="margin-top:15px"><label class="label">Concept notes</label><textarea class="area" id="designNotes" placeholder="Silhouette, construction, details, inspiration..."></textarea></div><div class="notice" style="margin-top:16px">The garment is an illustrative SVG concept. It does not include validated dimensions, grading, sewing instructions, or manufacturing specifications.</div></div></div>
 <div class="card" style="margin-top:18px"><div class="section-title"><h3>Saved design archive</h3><small>${state.designs.length} concepts</small></div><div class="grid design-cards">${state.designs.length?state.designs.map(d=>`<div class="design-card"><div class="design-art">${designSVG(d.shape,d.color)}</div><b>${esc(d.name)}</b><small>${esc(d.collection||"Independent concept")} · ${esc(d.fabric||"Fabric TBD")}</small><div class="item-actions"><button class="btn small" onclick="loadDesign('${d.id}')">Edit</button><button class="btn small" onclick="exportSavedDesign('${d.id}')">PNG</button><button class="btn small danger" onclick="deleteDesign('${d.id}')">×</button></div></div>`).join(""):empty("✳","No saved concepts yet","Design a garment and save it to start your own collection.")}</div></div>`;
}
function designSVG(shape,color){
 const common=`fill="${color}" stroke="#eeeeee" stroke-width="2" stroke-linejoin="round"`;
 let p="";
 if(shape==="tee")p=`<path ${common} d="M37 35 L64 17 L83 30 L99 20 L126 39 L109 64 L97 55 L101 140 L45 140 L49 55 L35 65 L20 40 Z"/><path d="M64 17 Q73 37 83 17" fill="none" stroke="#555" stroke-width="3"/>`;
 if(shape==="hoodie")p=`<path ${common} d="M50 39 Q48 5 80 5 Q112 5 110 39 L133 52 L117 81 L104 70 L107 145 L48 145 L50 70 L37 81 L21 52 Z"/><path d="M59 24 Q80 48 101 24 L101 41 Q80 60 59 41Z" fill="#555" stroke="#eee"/><path d="M63 78 L63 112 L96 112 L96 78" fill="none" stroke="#777" stroke-width="3"/>`;
 if(shape==="pants")p=`<path ${common} d="M43 16 L117 16 L113 70 L105 145 L79 145 L73 75 L67 145 L41 145 L35 70 Z"/><path d="M80 18 L80 67" stroke="#666" stroke-width="3"/><path d="M44 31 L116 31" stroke="#777" stroke-width="2"/>`;
 if(shape==="dress")p=`<path ${common} d="M60 15 L94 15 L100 49 L117 62 L141 145 L15 145 L39 62 L54 49 Z"/><path d="M60 15 Q77 42 94 15" fill="none" stroke="#666" stroke-width="3"/><path d="M40 65 L116 65" stroke="#666" stroke-width="3"/>`;
 return `<svg viewBox="0 0 155 160" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="cloth" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".2"/><stop offset="1" stop-color="#000000" stop-opacity=".2"/></linearGradient></defs>${p}<path d="M0 154 H155" stroke="#666" stroke-width="1"/></svg>`;
}
function drawDesignPreview(){const el=$("#designPreview");if(el)el.innerHTML=designSVG(designShape,selectedColor)}
function saveDesign(){const name=$("#designName")?.value.trim();if(!name)return toast("Enter a design name first.");const d={id:uid(),name,shape:designShape,color:selectedColor,collection:$("#designCollection").value.trim(),fabric:$("#designFabric").value.trim(),notes:$("#designNotes").value.trim(),createdAt:new Date().toISOString()};state.designs.push(d);saveState(true);renderPage();toast("Design added to your archive.")}
function loadDesign(id){const d=state.designs.find(x=>x.id===id);if(!d)return;designShape=d.shape;selectedColor=d.color;navigate("design");setTimeout(()=>{$("#designName").value=d.name;$("#designCollection").value=d.collection||"";$("#designFabric").value=d.fabric||"";$("#designNotes").value=d.notes||"";drawDesignPreview();editingDesignId=d.id},30)}
let editingDesignId=null;
function exportDesign(){const name=$("#designName")?.value.trim()||"fashion-concept";const svg=designSVG(designShape,selectedColor);exportSVG(svg,name)}
function exportSavedDesign(id){const d=state.designs.find(x=>x.id===id);if(d)exportSVG(designSVG(d.shape,d.color),d.name)}
function exportSVG(svg,name){const blob=new Blob([svg],{type:"image/svg+xml;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name.toLowerCase().replace(/[^a-z0-9]+/g,"-")+".svg";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast("Concept exported as SVG.")}
function deleteDesign(id){if(!confirm("Delete this design concept?"))return;state.designs=state.designs.filter(d=>d.id!==id);saveState(true);renderPage();toast("Design deleted.")}

function renderLookbooks(){
 return `${pageHead("CURATE YOUR PERSONAL STYLE","Lookbooks & Collections","Save outfit combinations, revisit favorites, and build a visual style archive.",`<button class="btn primary" onclick="navigate('studio')">＋ Create outfit</button>`)}
 <div class="card"><div class="section-title"><h3>Saved looks</h3><small>${state.outfits.length} outfits</small></div><div class="grid lookbook-grid">${state.outfits.length?state.outfits.map(o=>{const its=o.itemIds.map(getItem).filter(Boolean),imgs=its.filter(i=>i.image).slice(0,3);return `<article class="lookbook"><div class="lookbook-preview">${imgs.length?imgs.map(i=>`<img src="${i.image}" alt="${esc(i.name)}">`).join(""):`<div style="grid-column:1/-1;display:grid;place-items:center;color:#777;font-size:30px">◉</div>`}</div><div class="lookbook-body"><b>${esc(o.name)}</b><small>${esc(o.occasion||"Everyday")} · ${its.length} pieces</small>${o.notes?`<p class="tiny">${esc(o.notes)}</p>`:""}<div class="item-actions"><button class="btn small" onclick="loadOutfit('${o.id}')">Open</button><button class="btn small" onclick="toggleFavorite('${o.id}')">${state.favorites.includes(o.id)?"★ Saved":"☆ Favorite"}</button><button class="btn small danger" onclick="deleteOutfit('${o.id}')">×</button></div></div></article>`}).join(""):empty("▧","Your lookbook is empty","Compose a look in the Outfit Studio, then save it to your collection.",`<button class="btn primary" onclick="navigate('studio')">Start composing</button>`)}</div></div>
 <div class="card" style="margin-top:18px"><div class="section-title"><h3>Favorite looks</h3><small>Personally bookmarked</small></div><div class="grid lookbook-grid">${state.outfits.filter(o=>state.favorites.includes(o.id)).map(o=>`<div class="lookbook"><div class="lookbook-body"><b>${esc(o.name)}</b><small>${esc(o.occasion||"Everyday")}</small><div class="item-actions"><button class="btn small" onclick="loadOutfit('${o.id}')">Open</button><button class="btn small" onclick="toggleFavorite('${o.id}')">Remove favorite</button></div></div></div>`).join("")||`<p class="muted">Favorite an outfit above to find it here.</p>`}</div></div>`;
}
function toggleFavorite(id){state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];saveState(true);renderPage()}

function renderAnalytics(){
 const total=state.items.length,byCat=CATS.map(c=>({c,n:state.items.filter(i=>i.category===c).length})).filter(x=>x.n).sort((a,b)=>b.n-a.n),byColor={};state.items.forEach(i=>{const c=i.color||"Unspecified";byColor[c]=(byColor[c]||0)+1});
 const season={};state.items.forEach(i=>{const c=i.season||"All season";season[c]=(season[c]||0)+1});
 const fav=state.outfits.filter(o=>state.favorites.includes(o.id)).length;
 return `${pageHead("INSIGHTS THAT FIT","Style Analytics","Understand your digital wardrobe, discover collection gaps, and track your creative output.",`<button class="btn" onclick="exportBackup()">⇩ Export report data</button>`)}
 <div class="grid stats">${stat("TOTAL PIECES",total,"▤","Items in your wardrobe")}${stat("SAVED LOOKS",state.outfits.length,"◉","Outfit combinations")}${stat("DESIGN CONCEPTS",state.designs.length,"✳","Fashion ideas saved")}${stat("FAVORITE LOOKS",fav,"☆","Your bookmarked outfits")}</div>
 <div class="grid dashboard-grid"><div class="card"><div class="section-title"><h3>Wardrobe composition</h3><small>By category</small></div>${byCat.length?byCat.map(x=>`<div class="bar-row"><span>${esc(x.c)}</span><div class="bar"><span style="width:${total?x.n/total*100:0}%"></span></div><b>${x.n}</b></div>`).join(""):empty("⌁","No wardrobe data yet","Add items to unlock your wardrobe insights.")}</div>
 <div class="card"><div class="section-title"><h3>Color palette</h3><small>From item details</small></div>${Object.keys(byColor).length?Object.entries(byColor).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([c,n])=>`<div class="bar-row" style="grid-template-columns:100px 1fr 25px"><span>${esc(c)}</span><div class="bar"><span style="width:${n/total*100}%"></span></div><b>${n}</b></div>`).join(""):empty("◈","No colors recorded","Add color details to clothing items.")}</div>
 <div class="card"><div class="section-title"><h3>Season distribution</h3><small>Self-reported tags</small></div>${Object.keys(season).length?Object.entries(season).map(([c,n])=>`<div class="bar-row"><span>${esc(c)}</span><div class="bar"><span style="width:${n/total*100}%"></span></div><b>${n}</b></div>`).join(""):"No seasonal data."}</div>
 <div class="card"><div class="section-title"><h3>Creative activity</h3><small>Saved content</small></div>${[["Wardrobe pieces",total],["Outfits",state.outfits.length],["Designs",state.designs.length],["Calendar plans",Object.keys(state.plans).length]].map(([n,v])=>`<div style="display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid #2a2a2a"><span class="muted">${n}</span><b>${v}</b></div>`).join("")}<p class="footnote">Analytics are calculated from the information you enter. CLOSETIQ does not track real-world wear, purchase prices, or garment sustainability unless you record those details yourself.</p></div></div>`;
}

function renderProfile(){return `${pageHead("YOUR SIGNATURE","My Style Profile","Personalize your studio and keep your style preferences together.")}<div class="split"><div class="card"><div class="section-title"><h3>Style identity</h3><small>Saved locally</small></div><form onsubmit="saveProfile(event)"><div class="form-field"><label class="label">Your display name</label><input class="field" id="profileName" maxlength="70" value="${esc(state.profile.name)}" placeholder="What should your studio call you?"></div><div class="form-field" style="margin-top:15px"><label class="label">Signature style</label><select class="select" id="profileStyle" style="width:100%">${["Minimalist","Streetwear","Classic","Luxury","Sporty","Vintage","Bohemian","Formal","Experimental","Eclectic","Other"].map(x=>`<option ${state.profile.style===x?"selected":""}>${x}</option>`).join("")}</select></div><div class="form-field" style="margin-top:15px"><label class="label">Most common occasion</label><select class="select" id="profileOccasion" style="width:100%">${["Everyday","School","Work","Party","Formal","Travel","Sport","Special events"].map(x=>`<option ${state.profile.occasion===x?"selected":""}>${x}</option>`).join("")}</select></div><div class="form-field" style="margin-top:15px"><label class="label">Optional clothing sizes</label><input class="field" id="profileSizes" value="${esc(state.profile.sizes)}" placeholder="Enter only what you want to record"></div><div class="form-field" style="margin-top:15px"><label class="label">About your style</label><textarea class="area" id="profileBio">${esc(state.profile.bio)}</textarea></div><button class="btn primary" style="margin-top:20px;width:100%">Save style profile</button></form></div><div class="card"><div class="section-title"><h3>Studio identity</h3><small>Preview</small></div><div class="profile-row"><div class="profile-avatar">✧</div><div><b>${esc(state.profile.name||"Your name")}</b><div class="tiny" style="margin-top:6px">${esc(state.profile.style)} style</div></div></div><div class="divider"></div><p class="muted" style="line-height:1.9">Your profile helps organize your preferences. It does not use AI to judge your appearance or determine what you should wear.</p><button class="btn" onclick="navigate('settings')">Privacy & storage settings ↗</button></div></div>`}
function saveProfile(e){e.preventDefault();state.profile={name:$("#profileName").value.trim(),style:$("#profileStyle").value,occasion:$("#profileOccasion").value,sizes:$("#profileSizes").value.trim(),bio:$("#profileBio").value.trim()};saveState(true);updateHeader();renderPage();toast("Style profile saved.")}

function renderSettings(){let bytes=0;try{bytes=new Blob([localStorage.getItem("closetiq_ultimate_v1")||""]).size}catch(e){}return `${pageHead("YOUR STUDIO, YOUR RULES","Settings & Backup","Manage local data, export a backup, and control your personal workspace.")}<div class="split"><div class="card"><div class="section-title"><h3>Data & backup</h3><small>Local-first storage</small></div><div class="notice">Your wardrobe, designs, outfits, profile and plans are saved in this browser's local storage. Browser storage can be cleared by device settings, private browsing, or storage pressure. It is not cloud backup or cross-device sync.</div><div style="margin-top:18px"><div class="bar-row"><span>Saved data</span><div class="bar"><span style="width:${Math.min(100,bytes/5000000*100)}%"></span></div><b>${(bytes/1024).toFixed(1)} KB</b></div><p class="tiny">Browser quotas vary. Large photo libraries may exceed available storage. Image uploads are compressed, but use moderate photo sizes.</p></div><div class="grid" style="margin-top:18px"><button class="btn primary" onclick="exportBackup()">⇩ Download full JSON backup</button><button class="btn" onclick="$('#importFile').click()">⇧ Restore from JSON backup</button><button class="btn" onclick="exportWardrobeCSV()">⇩ Export wardrobe CSV</button><button class="btn" onclick="exportAllImages()">⇩ Export clothing images</button></div></div><div class="card"><div class="section-title"><h3>Privacy & maintenance</h3><small>Manage this device</small></div><div class="profile-row"><div class="stat-icon">◇</div><div><b>Local-first design</b><p class="tiny">This app makes no paid API calls and sends no clothing photos to an app server.</p></div></div><div class="divider"></div><div class="profile-row"><div class="stat-icon">▤</div><div><b>Export before clearing</b><p class="tiny">Create a JSON backup to preserve your wardrobe and saved data.</p></div></div><div class="divider"></div><div class="profile-row"><div class="stat-icon">↺</div><div><b>Start fresh</b><p class="tiny">Permanently removes CLOSETIQ data stored under this app's local storage key.</p></div></div><button class="btn danger" style="width:100%;margin-top:18px" onclick="resetApp()">Reset all app data</button><p class="footnote">Use the same browser and site origin to access local data. GitHub Pages does not automatically synchronize data across devices.</p></div></div>`}
$("#importFile").addEventListener("change",async e=>{const f=e.target.files?.[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!data||!Array.isArray(data.items)||!Array.isArray(data.outfits))throw new Error("Invalid backup");if(!confirm("Restore this backup? Current CLOSETIQ data will be replaced."))return;state={...DEFAULT(),...data,profile:{...DEFAULT().profile,...data.profile},settings:{...DEFAULT().settings,...data.settings}};saveState(true);navigate("dashboard");toast("Backup restored.")}catch(err){toast("Could not restore: invalid or incompatible backup.",4000)}finally{e.target.value=""}});
function exportBackup(){const data=JSON.stringify({...state,exportedAt:new Date().toISOString(),app:"CLOSETIQ"},null,2);downloadBlob(data,"closetiq-backup.json","application/json");toast("Backup exported. Keep it somewhere safe.")}
function downloadBlob(data,name,type){const blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function exportWardrobeCSV(){const rows=[["Name","Category","Color","Season","Brand","Tags","Notes"],...state.items.map(i=>[i.name,i.category,i.color,i.season,i.brand,i.tags,i.notes])];const csv=rows.map(r=>r.map(v=>`"${String(v||"").replace(/"/g,'""')}"`).join(",")).join("\r\n");downloadBlob("\ufeff"+csv,"closetiq-wardrobe.csv","text/csv;charset=utf-8");toast("Wardrobe CSV exported.")}
async function exportAllImages(){const imgs=state.items.filter(i=>i.image);if(!imgs.length)return toast("No clothing images to export.");const payload=imgs.map(i=>({name:i.name,category:i.category,image:i.image}));downloadBlob(JSON.stringify(payload),"closetiq-images.json","application/json");toast("Images exported inside a JSON archive.")}
function resetApp(){if(!confirm("Permanently erase your CLOSETIQ wardrobe, outfits, calendar, profile, and designs from this browser? Export a backup first if needed."))return;localStorage.removeItem("closetiq_ultimate_v1");state=DEFAULT();canvasImages=[];studioPhoto=null;renderPage();updateHeader();toast("CLOSETIQ data reset.")}

function openModal(title,content){$("#modalRoot").innerHTML=`<div class="modal-back" id="modalBack" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h2>${esc(title)}</h2><button class="icon-btn" onclick="closeModal()" aria-label="Close">×</button></div>${content}</section></div>`}
function closeModal(){$("#modalRoot").innerHTML="";editingItem=null}
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeModal();$("#sidebar").classList.remove("open")}});

updateHeader();renderPage();
</script>
</body>
</html>
